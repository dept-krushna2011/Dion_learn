<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard - Dion Learn</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: radial-gradient(circle at top right,#312e81 0%,transparent 30%), radial-gradient(circle at bottom left,#581c87 0%,transparent 30%), #020617;
      --card: linear-gradient(145deg, rgba(15, 23, 42, 0.95), rgba(17, 24, 39, 0.88));
      --text: #ffffff; --muted: #cbd5e1; --accent: #8b5cf6; --border: rgba(255,255,255,0.08);
      --green: #10b981; --yellow: #f59e0b;
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
    body { background: var(--bg); color: var(--text); min-height:100vh; padding:30px; }
    .container { max-width:900px; margin:0 auto; }
    h1 { font-size:36px; font-weight:800; margin-bottom:8px; }
    h1 span { color:var(--accent); }
    .subtitle { color:var(--muted); margin-bottom:30px; }

    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:20px; margin-bottom:35px; }
    .stat-card {
      background:var(--card); border:1px solid var(--border); border-radius:18px;
      padding:28px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.2);
    }
    .stat-card .num { font-size:48px; font-weight:800; color:var(--accent); }
    .stat-card .label { color:var(--muted); font-size:14px; margin-top:4px; }

    .table-card {
      background:var(--card); border:1px solid var(--border); border-radius:18px;
      padding:28px; box-shadow:0 10px 30px rgba(0,0,0,0.2); overflow-x:auto;
    }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th { background:rgba(139,92,246,0.15); color:var(--accent); padding:12px 14px; text-align:left; font-weight:600; }
    td { padding:10px 14px; color:var(--muted); border-bottom:1px solid var(--border); }
    tr:hover td { background:rgba(139,92,246,0.05); }

    .refresh-btn {
      padding:10px 22px; background:var(--accent); color:white; border:none;
      border-radius:10px; cursor:pointer; font-weight:600; margin-top:20px; font-size:14px;
    }
    .refresh-btn:hover { background:#7c3aed; }
  </style>
</head>
<body>

<div class="container">
  <h1>📊 <span>Dashboard</span></h1>
  <p class="subtitle">Track your website visitors and activity</p>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="num" id="totalVisits">0</div>
      <div class="label">Total Page Visits</div>
    </div>
    <div class="stat-card">
      <div class="num" id="todayVisits">0</div>
      <div class="label">Visits Today</div>
    </div>
    <div class="stat-card">
      <div class="num" id="contactMsgs">0</div>
      <div class="label">Contact Messages</div>
    </div>
    <div class="stat-card">
      <div class="num" id="totalUsers">0</div>
      <div class="label">Registered Users</div>
    </div>
  </div>

  <div class="table-card">
    <h2 style="margin-bottom:16px;">📋 Recent Visits</h2>
    <table>
      <thead>
        <tr><th>#</th><th>Page</th><th>Date & Time</th></tr>
      </thead>
      <tbody id="recentVisits">
        <tr><td colspan="3" style="text-align:center;">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <button class="refresh-btn" onclick="loadStats()">🔄 Refresh Data</button>
</div>

<script>
  const SUPABASE_URL = 'https://lpnsveyywkfeeydbbojg.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxwbnN2ZXl5d2tmZWV5ZGJib2pnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzMzgyNTMsImV4cCI6MjA5NjkxNDI1M30.GdxG3a2KlxpNW36Ezq1dvtsyKSAtg2o5kcHja_sybkU';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function loadStats() {
    // Total visits
    const { count: totalVisits } = await supabase.from('page_visits').select('*', { count: 'exact', head: true });
    document.getElementById('totalVisits').textContent = totalVisits || 0;

    // Today's visits
    const today = new Date().toISOString().split('T')[0];
    const { count: todayVisits } = await supabase.from('page_visits').select('*', { count: 'exact', head: true }).gte('visited_at', today);
    document.getElementById('todayVisits').textContent = todayVisits || 0;

    // Contact messages
    const { count: contactMsgs } = await supabase.from('contact_messages').select('*', { count: 'exact', head: true });
    document.getElementById('contactMsgs').textContent = contactMsgs || 0;

    // Total users
    const { count: totalUsers } = await supabase.from('users').select('*', { count: 'exact', head: true });
    document.getElementById('totalUsers').textContent = totalUsers || 0;

    // Recent visits
    const { data: recent } = await supabase.from('page_visits').select('*').order('visited_at', { ascending: false }).limit(20);
    const tbody = document.getElementById('recentVisits');
    if (recent && recent.length > 0) {
      tbody.innerHTML = recent.map((v, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${v.page_name}</td>
          <td>${new Date(v.visited_at).toLocaleString()}</td>
        </tr>
      `).join('');
    } else {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">No visits yet</td></tr>';
    }
  }

  loadStats();
</script>
<script src="auth.js"></script>
</body>
</html>
